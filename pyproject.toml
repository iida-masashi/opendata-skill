[project]
name = "opendata-skill"
version = "2.4.0"
description = "Comprehensive Open Data Fetcher & Demand Forecasting Feature Pipeline (Japan/US/EU/Global)"
authors = [{ name = "Masashi Iida" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "yfinance>=1.2.0",
    "wbgapi>=1.0.12",
    "pandas>=3.0.0",
    "polars>=2.1.0",
    "requests>=2.32.0",
    "httpx>=0.28.0",
    "tenacity>=9.1.4",
    "edinetdb>=0.1.0",
    "trendspyg>=1.9,<2",
    "python-dotenv>=1.2.2",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.2",
    "google-api-python-client>=2.150.0",
]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = ["integration: 実APIにアクセスするテスト（既定では除外。`-m integration` で実行）"]
addopts = "-m 'not integration'"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.11.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "DTZ", "PTH"]
ignore = ["E501", "SIM108", "B905", "PTH110"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]



[project]
name = "opendata-skill"
version = "2.3.1"
description = "Comprehensive Open Data Fetcher (Yahoo, WB, OECD, Weather)"
authors = [{ name = "Masashi Iida" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "yfinance",
    "wbgapi",
    "pandas",
    "polars>=2",
    "requests",
    "httpx",
    "tenacity>=9.1.4",
    "edinetdb",
    "trendspyg>=1.9,<2",
    "python-dotenv>=1.2.2",
    "matplotlib",
    "seaborn",
    "google-api-python-client",
]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = ["integration: 実APIにアクセスするテスト（既定では除外。`-m integration` で実行）"]
addopts = "-m 'not integration'"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
